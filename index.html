<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hình 8.3 - Trang 50 SGK Tin học</title>
</head>
<body>
    <form action="" method="post">
        <h2>Thông tin liên hệ</h2>
        
        <p>
            <label for="hoten">Họ và tên:</label><br>
            <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên">
        </p>
        
        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email">
        </p>
        
        <p>
            <label for="noidung">Nội dung góp ý:</label><br>
            <textarea id="noidung" name="noidung" rows="4" cols="40" placeholder="Nhập nội dung..."></textarea>
        </p>
        
        <p>
            <input type="submit" value="Gửi">
            <input type="reset" value="Nhập lại">
        </p>
    </form>
</body>
</html>
